<div class="recipe">
    <h2> Sam's Chocolate Chip Cookies</h2>
    <h3>Ingredients:</h3>
    <ul>
      <li>2 cups flour</li>
      <li>1 cup butter</li>
      <li>1 cup chocolate chips</li>
      <li>2 eggs</li>
    </ul>
  <h3>Instructions:</h3>
  <ol>
    <li>Mix butter and sugar</li>
    <li>Add eggs and flour</li>
    <li>Fold in chocolate chips</li>
    <li>Bake at 350°F for 12 minutes</li>
  </ol>
</div>
